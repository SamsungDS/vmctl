#!/usr/bin/env bash

CLOUD_INIT_STAGE_DIR="$(mktemp -d)"
trap 'rm -rfv ${CLOUD_INIT_STAGE_DIR}' EXIT

#CLOUD_INIT_SSHKEY="ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQDFAKEKEYPLACEHOLDER ubuntu@placeholder"
CLOUD_INIT_STAGE_FILE="${CLOUD_INIT_STAGE_DIR}/seed.img"
CLOUD_INIT_OUTPUT_IMG="img/base.qcow2"
GUEST_BOOT_BASE="${CLOUD_INIT_STAGE_DIR}/base.qcow2"
source "x86_64-q35-base.conf"

cloudinit_wget_ubuntu() {
  local cloud_img_path="$1"
  local uimg="https://cloud-images.ubuntu.com/releases/plucky/release"
  uimg="${uimg}/ubuntu-25.04-server-cloudimg-amd64.img"
  wget -O "${cloud_img_path}" "${uimg}"
}

cloudinit_resize_img() {
  local cloud_img_path="$1"
  qemu-img resize "${cloud_img_path}" 8G
}

cloudinit_get_sshkey() {
  if [[ -v CLOUD_INIT_SSHKEY ]]; then
    echo "${CLOUD_INIT_SSHKEY}"
    return 0
  fi

  SSH_KEY_FILE=$(find ~/.ssh -maxdepth 1 -type f -name "*.pub" | head -n 1)

  if [[ -z "$SSH_KEY_FILE" ]]; then
      _fatal 1 "No public key found in ~/.ssh. Try setting CLOUD_INIT_SSHKEY."
  fi

  # Read the key content
  CLOUD_INIT_SSHKEY=$(cat "$SSH_KEY_FILE")
  echo "${CLOUD_INIT_SSHKEY}"
  return 0
}

cloudinit_make_userdatafile() {
  local usr_data_file="$1"
  local ssh_key=""
  ssh_key="$(cloudinit_get_sshkey)"

  cat > "${usr_data_file}" << EOF
#cloud-config
disable_root: false
ssh_pwauth: false

users:
  - name: vmuser
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    groups: users, admin
    home: /home/vmuser
    shell: /bin/bash
    lock_passwd: false
    plain_text_passwd: 'vmuser'
    ssh_authorized_keys:
      - ${ssh_key}

  - name: root
    ssh_authorized_keys:
      - ${ssh_key}

write_files:
- path: /etc/systemd/system/mount-shared-kernel-dir.service
  content: |
    # Cribbed and slightly modified from a systemd unit-file created by Omar
    # Sandoval:
    # https://github.com/osandov/osandov-linux/blob/master/scripts/vm-modules-mounter.service

    [Unit]
    Description=Mount shared kernel build dir
    DefaultDependencies=no
    After=systemd-remount-fs.service
    Before=local-fs-pre.target systemd-modules-load.service systemd-udevd.service kmod-static-nodes.service umount.target
    Conflicts=umount.target
    RefuseManualStop=true
    ConditionPathExists=!/lib/modules/%v/kernel

    [Install]
    WantedBy=local-fs-pre.target

    [Service]
    Type=oneshot
    RemainAfterExit=yes
    ExecStart=mount -t tmpfs -o mode=755,strictatime,x-mount.mkdir,x-initrd.mount tmpfs /lib/modules/%v
    ExecStart=mount -t 9p -o trans=virtio,ro,x-mount.mkdir,x-initrd.mount kernel_dir /lib/modules/%v/build
    ExecStart=ln -s build/modules.order /lib/modules/%v/modules.order
    ExecStart=ln -s build/modules.builtin /lib/modules/%v/modules.builtin
    ExecStart=ln -s build /lib/modules/%v/kernel
    ExecStart=-depmod %v
    ExecStopPost=sh -c 'if mountpoint -q /lib/modules/%v/build; then umount -l /lib/modules/%v/build; fi'
    ExecStopPost=sh -c 'if mountpoint -q /lib/modules/%v; then umount -l /lib/modules/%v; fi'
    ExecStopPost=find /lib/modules -mindepth 1 -maxdepth 1 -type d -empty -delete
    ExecReload=-depmod %v

runcmd:
  - [ systemctl, daemon-reload ]
  - [ systemctl, enable, mount-shared-kernel-dir.service ]

power_state:
  mode: poweroff
  condition: true
EOF
}

cloudinit_make_metadatafile() {
  local meta_data_file="$1"

  cat > "${meta_data_file}" << EOF
#cloud-config
#instance-id: vmctl-1
#local-hostname: vmctl
EOF
}

cloudinit_make_seed_img() {
  local seed_img_path="$1"
  local usr_data_file="${CLOUD_INIT_STAGE_DIR}/user-data"
  local meta_data_file="${CLOUD_INIT_STAGE_DIR}/meta-data"

  cloudinit_make_userdatafile "${usr_data_file}"
  cloudinit_make_metadatafile "${meta_data_file}"

  mkisofs -output "${seed_img_path}" \
    -volid cidata -joliet -rock "${usr_data_file}" "${meta_data_file}"
}

_pre() {
  _require_program mkisofs
  _require_program wget
  local cloud_img="${GUEST_BOOT}"

  if [[ -f "${CLOUD_INIT_OUTPUT_IMG}" ]]; then
    _fatal 1 "${CLOUD_INIT_OUTPUT_IMG} exist; rename to avoid overwriting"
  fi

  cloudinit_wget_ubuntu "${cloud_img}"
  cloudinit_resize_img "${cloud_img}"
  cloudinit_make_seed_img "${CLOUD_INIT_STAGE_FILE}"
}

_setup_cloudinit() {
  _setup_x86_64_q35_base

  QEMU_PARAMS+=("-drive" "id=cloud-init-seed,file=${CLOUD_INIT_STAGE_FILE},format=raw,media=cdrom")
}

_post() {
  mkdir -p "img"
  mv "${GUEST_BOOT}" "${CLOUD_INIT_OUTPUT_IMG}"
}
